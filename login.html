<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HWCC | ننوتل</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Inline error message style */
    .error-message {
      color: red;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 8px;
      display: block;
    }
    input:focus {
      outline: none;
      border: 1px solid #0d6efd;
    }
  </style>
</head>
<body class="auth-page">
  <main class="auth-wrapper">
    <div class="auth-card">
      <a class="auth-logo" href="index.html">هیواد ودان ساختمانی شرکت</a>

      <h1>اکاونټ ته ننوتل</h1>
      <p class="auth-subtitle">خپل ایمیل او پټنوم ولیکئ.</p>

      <form class="auth-form" id="loginForm" novalidate>
        <label for="email">ایمیل</label>
        <input type="email" id="email" placeholder="example@email.com" />
        <small id="emailError" class="error-message"></small>

        <label for="password">پټنوم</label>
        <input type="password" id="password" placeholder="********" />
        <small id="passwordError" class="error-message"></small>

        <button type="submit" class="btn btn-primary full-btn">ننوتل</button>
      </form>

      <p class="auth-footer">
        حساب نه لرئ؟ <a href="signup.html">حساب جوړول</a>
      </p>
    </div>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      let isValid = true;

      emailError.textContent = "";
      passwordError.textContent = "";

      // Email validation
      if (email === "") {
        emailError.textContent = "مهرباني وکړئ ایمیل داخل کړئ";
        isValid = false;
      } else if (!validateEmail(email)) {
        emailError.textContent = "مهرباني وکړئ سم ایمیل داخل کړئ";
        isValid = false;
      }

      // Password validation
      if (password === "") {
        passwordError.textContent = "مهرباني وکړئ پټنوم داخل کړئ";
        isValid = false;
      } else if (password.length < 6) {
        passwordError.textContent = "پټنوم باید لږ تر لږه ۶ توري وي";
        isValid = false;
      }

      // If valid, store in localStorage
      if (isValid) {
        localStorage.setItem("userEmail", email);
        localStorage.setItem("userPassword", password);
        alert("په بریالیتوب سره ننوتل!");
        // redirect or reload page
        window.location.href = "index.html";
      }
    });

    function validateEmail(email) {
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailPattern.test(email);
    }
  </script>
</body>
</html>
